name: game_stats
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
